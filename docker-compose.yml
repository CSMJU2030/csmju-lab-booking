# ทดสอบ image แบบเดียวกับ server ในเครื่อง — docs/deployment.md ข้อ 6
#   docker compose up -d --build   → db + api + web ต้อง healthy
#   เปิด http://localhost:3002 (callback ที่ลงทะเบียนไว้ใน Core Hub)
#
# ชื่อ service "api" และพอร์ต 4000 ห้ามเปลี่ยน — frontend/Dockerfile ฝัง http://api:4000 ไว้ตอน build (ข้อ 3.2)
# api และ web ล็อกแบบเดียวกับ server: read_only · cap_drop ALL · no-new-privileges · จำกัด RAM · หมุน log
# ฐานข้อมูลเป็นของระบบนี้เอง ไม่เคยต่อฐานของ Core Hub — ต่อ Core Hub ผ่าน HTTPS (JWKS) เท่านั้น

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab_booking
      POSTGRES_PASSWORD: lab_booking_local_only
      POSTGRES_DB: lab_booking
    volumes:
      - lab-booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab_booking -d lab_booking']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Bangkok
      DATABASE_URL: postgresql://lab_booking:lab_booking_local_only@db:5432/lab_booking
      DATABASE_POOL_MAX: 5
      CORE_HUB_URL: ${CORE_HUB_URL:-https://csmju2030.jowave.com}
      CORE_HUB_JWKS_URL: ${CORE_HUB_JWKS_URL:-https://csmju2030.jowave.com/api/v1/.well-known/jwks.json}
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-https://csmju2030.jowave.com}
      CORE_HUB_ISSUER: core-hub
      CORE_HUB_AUDIENCE: csmju2030
      SUBSYSTEM_ID: csmju-lab-booking
      SUBSYSTEM_NAME: CSMJU Lab Booking
      SSO_POST_LOGIN_REDIRECT: /
      # web (Next.js) อยู่หน้า api ใน network ของ compose
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
    # ไม่เปิดพอร์ตออกนอก — web ส่ง /api/* และ /auth/* มาให้ (ข้อ 3.1)

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    environment:
      TZ: Asia/Bangkok
      SUBSYSTEM_ID: csmju-lab-booking
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-https://csmju2030.jowave.com}
    ports:
      # พอร์ต frontend ของทีม — ตรงกับ callback http://localhost:3002/auth/callback ที่ลงทะเบียนไว้
      - '127.0.0.1:3002:3000'

volumes:
  lab-booking-db-data:

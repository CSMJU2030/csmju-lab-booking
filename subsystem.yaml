# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-lab-booking          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.7.0"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

base_url: http://localhost:3002       # URL ของระบบย่อยตอนรันเพื่อทดสอบ
core_hub_url: http://localhost:3000
core_hub_web_url: http://localhost:3100   # หน้า login ของ Core Hub (ในเครื่องแยกพอร์ตจาก API)
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/callback

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  collection: /api/v1/schedules
  not_found: /api/v1/schedules/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/schedules/not-a-uuid
  create:
    path: /api/v1/schedules
    allowed_role: staff
    denied_role: alumni                # มีบัญชีทั้ง Core Hub ในเครื่องและตัวจริง (student บนตัวจริงไม่มีบัญชีรหัสผ่าน)
    invalid_body:
      courseCode: ""
    valid_body:
      instructorName: Conformance Probe
      courseCode: "10301111"
      courseName: Conformance probe class
      roomName: Lab คอม 3
      day: SATURDAY
      startTime: "09:00"
      endTime: "10:00"

owners:
  pl: "@csmju2030/pl-lab-booking"
  aie: "@csmju2030/aie-lab-booking"

display_name: "Lab Booking"
repo: github.com/CSMJU2030/csmju-lab-booking
status: proposed
